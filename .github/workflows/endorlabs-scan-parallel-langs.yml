# ─────────────────────────────────────────────────────────────────
# Generated by Saber v0.1.0 on 2026-07-18 for nx
#
#   Languages:    java, javascript/typescript, c#/.net, rust
#   Build:        maven, pnpm, cargo, gradle
#   Namespace:    endor-solutions-ypulse.github-ci.saber-e2e
#   Auth:         GitHub OIDC (keyless)
#   PR behavior:  comment on PR (non-blocking)
#   PR scan mode: quick
#
# Regenerate this file with `saber scan repo` (point at this repo's path).
# Hand-edits will be overwritten on the next regeneration.
# ─────────────────────────────────────────────────────────────────
#
# Saber split one or more scan units to fit standard runner memory:
#   • java: 2 shards (packages, root)
#     Saber split the java scan into multiple jobs because this repo has 11
#     java root manifests — a single full-reachability scan exceeds the
#     ubuntu-latest runner memory budget. Each shard scans one top-level
#     subtree with full reachability preserved.
#   • javascript/typescript: 8 shards (packages, nx-dev, examples, graph, tools, astro-docs, benchmarks, root)
#     Saber split the javascript/typescript scan into multiple jobs because
#     this repo has 99 javascript/typescript root manifests — a single
#     full-reachability scan exceeds the ubuntu-latest runner memory budget.
#     Each shard scans one top-level subtree with full reachability preserved.
#
name: Endor Labs Scan
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
jobs:
  detect-changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: read
    outputs:
      java-packages: ${{ steps.filter.outputs.java-packages }}
      java-root: ${{ steps.filter.outputs.java-root }}
      javascript-typescript-packages: ${{ steps.filter.outputs.javascript-typescript-packages }}
      javascript-typescript-nx-dev: ${{ steps.filter.outputs.javascript-typescript-nx-dev }}
      javascript-typescript-examples: ${{ steps.filter.outputs.javascript-typescript-examples }}
      javascript-typescript-graph: ${{ steps.filter.outputs.javascript-typescript-graph }}
      javascript-typescript-tools: ${{ steps.filter.outputs.javascript-typescript-tools }}
      javascript-typescript-astro-docs: ${{ steps.filter.outputs.javascript-typescript-astro-docs }}
      javascript-typescript-benchmarks: ${{ steps.filter.outputs.javascript-typescript-benchmarks }}
      javascript-typescript-root: ${{ steps.filter.outputs.javascript-typescript-root }}
      c-net: ${{ steps.filter.outputs.c-net }}
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |-
            java-packages:
              - packages/**/'**/pom.xml'
              - packages/**/'**/build.gradle'
              - packages/**/'**/build.gradle.kts'
              - packages/**/'**/*.java'
            java-root:
              - '**/pom.xml'
              - '**/build.gradle'
              - '**/build.gradle.kts'
              - '**/*.java'
            javascript-typescript-packages:
              - packages/**/'**/package.json'
              - packages/**/'**/package-lock.json'
              - packages/**/'**/yarn.lock'
              - packages/**/'**/pnpm-lock.yaml'
              - packages/**/'**/rush.json'
              - packages/**/'**/*.js'
              - packages/**/'**/*.ts'
              - packages/**/'**/*.tsx'
            javascript-typescript-nx-dev:
              - nx-dev/**/'**/package.json'
              - nx-dev/**/'**/package-lock.json'
              - nx-dev/**/'**/yarn.lock'
              - nx-dev/**/'**/pnpm-lock.yaml'
              - nx-dev/**/'**/rush.json'
              - nx-dev/**/'**/*.js'
              - nx-dev/**/'**/*.ts'
              - nx-dev/**/'**/*.tsx'
            javascript-typescript-examples:
              - examples/**/'**/package.json'
              - examples/**/'**/package-lock.json'
              - examples/**/'**/yarn.lock'
              - examples/**/'**/pnpm-lock.yaml'
              - examples/**/'**/rush.json'
              - examples/**/'**/*.js'
              - examples/**/'**/*.ts'
              - examples/**/'**/*.tsx'
            javascript-typescript-graph:
              - graph/**/'**/package.json'
              - graph/**/'**/package-lock.json'
              - graph/**/'**/yarn.lock'
              - graph/**/'**/pnpm-lock.yaml'
              - graph/**/'**/rush.json'
              - graph/**/'**/*.js'
              - graph/**/'**/*.ts'
              - graph/**/'**/*.tsx'
            javascript-typescript-tools:
              - tools/**/'**/package.json'
              - tools/**/'**/package-lock.json'
              - tools/**/'**/yarn.lock'
              - tools/**/'**/pnpm-lock.yaml'
              - tools/**/'**/rush.json'
              - tools/**/'**/*.js'
              - tools/**/'**/*.ts'
              - tools/**/'**/*.tsx'
            javascript-typescript-astro-docs:
              - astro-docs/**/'**/package.json'
              - astro-docs/**/'**/package-lock.json'
              - astro-docs/**/'**/yarn.lock'
              - astro-docs/**/'**/pnpm-lock.yaml'
              - astro-docs/**/'**/rush.json'
              - astro-docs/**/'**/*.js'
              - astro-docs/**/'**/*.ts'
              - astro-docs/**/'**/*.tsx'
            javascript-typescript-benchmarks:
              - benchmarks/**/'**/package.json'
              - benchmarks/**/'**/package-lock.json'
              - benchmarks/**/'**/yarn.lock'
              - benchmarks/**/'**/pnpm-lock.yaml'
              - benchmarks/**/'**/rush.json'
              - benchmarks/**/'**/*.js'
              - benchmarks/**/'**/*.ts'
              - benchmarks/**/'**/*.tsx'
            javascript-typescript-root:
              - '**/package.json'
              - '**/package-lock.json'
              - '**/yarn.lock'
              - '**/pnpm-lock.yaml'
              - '**/rush.json'
              - '**/*.js'
              - '**/*.ts'
              - '**/*.tsx'
            c-net:
              - '**/*.csproj'
              - '**/packages.lock.json'
              - '**/Directory.Build.props'
              - '**/Directory.Packages.props'
              - '**/*.props'
              - '**/*.targets'
              - '**/*.cs'
            rust:
              - '**/Cargo.toml'
              - '**/Cargo.lock'
              - '**/*.rs'
  scan-java-packages-pr:
    name: "PR Scan: java (packages)"
    needs: detect-changes
    if: github.event_name == 'pull_request' && needs.detect-changes.outputs.java-packages == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      id-token: write
      security-events: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - run: ./mvnw install -DskipTests -q
      - uses: endorlabs/github-action@f46ffb04c928a9c9c356f9627bd60b710ed0963e
        with:
          namespace: "endor-solutions-ypulse.github-ci.saber-e2e"
          scan_dependencies: true
          pr: true
          enable_pr_comments: true
          github_token: ${{ secrets.GITHUB_TOKEN }}
          enable_github_action_token: true
          additional_args: "--languages=java --include-path=packages/** --quick-scan"
  scan-java-packages-monitor:
    name: "Monitor Scan: java (packages)"
